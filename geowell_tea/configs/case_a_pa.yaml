# Case A - Western Pennsylvania greenhouse, reused gas well (hypothetical candidate).
# status: published | assumed | derived | measured
case:
  name: "Case A - Western PA greenhouse"
  description: "Hypothetical existing ~5,700 ft gas well near a 10,000 ft2 greenhouse. Resource anchored to the Penn State (2025) case study; no well log, completion diagram or quote is held."

geology:
  depth: {value: 1737, status: published, source: "Penn State 2025 'Sustainable Well Upcycling for Greenhouse Heating' - 5,700 ft well (rounded)"}
  T_bottom: {value: 80.0, status: published, source: "Same study: ~80 C bottom-hole temperature"}
  T_surface: {value: 12.0, status: assumed, source: "Scenario assumption, not measured at the well"}
  k: {value: 2.5, low: 1.5, high: 4.0, status: assumed, source: "Scenario assumption"}
  rho: {value: 2400, status: assumed, source: "Scenario assumption"}
  cp: {value: 900, status: assumed, source: "Scenario assumption"}
  groundwater_advection: {value: false, status: assumed, source: "Off in baseline; unknown"}

well:
  casing_id: {value: 0.150, low: 0.10, high: 0.20, status: assumed, source: "Usable clear ID; clearance budget enforced"}
  casing_wall: {value: 0.0095, status: assumed, source: "Typical production casing wall"}
  cement_thickness: {value: 0.025, status: assumed, source: "Casing OD to rock face"}

load:
  peak_month_kW: {value: 120, low: 60, high: 200, status: assumed, source: "Peak-month average greenhouse demand. Set equal to the Penn State study's modelled 120 kW capacity as a proxy for the greenhouse's design demand - NOT a resource cap"}
  shape: {value: western_pa, status: assumed, source: "Monthly HDD-shaped profile (approximate)"}
  flh: {value: 5000, low: 3000, high: 8000, status: assumed, source: "Brief: 5,000 full-load-equivalent h/yr screening value"}
  T_supply: {value: 45.0, status: assumed, source: "Brief: 45/35 C hydronic"}
  T_return: {value: 35.0, status: assumed, source: "Brief"}
  distance_m: {value: 250, low: 0, high: 1000, status: assumed, source: "Brief"}

prices:
  electricity_price: {value: 0.13, low: 0.08, high: 0.45, status: published, source: "EIA Electric Power Monthly Table 5.6.A: PA commercial 13.02 c/kWh (Nov 2025). Range = brief sweep"}
  incumbent_fuel_price_per_MWh: {value: 40.7, status: derived, source: "PA commercial natural gas $12.38/Mcf (EIA, Jan 2026) / 0.3039 MWh per Mcf"}
  incumbent_efficiency: {value: 0.85, status: assumed, source: "Gas boiler seasonal efficiency"}
  incumbent_emission_factor_t_per_MWh: {value: 0.181, status: published, source: "EPA emission factor for natural gas, 53.06 kg CO2/MMBtu (HHV)"}
  plugging_eol: {value: 110000, low: 60000, high: 400000, status: published, source: "PA DEP: average plugging cost about $110,000 in 2024 (orphan-well program); range from public reporting"}

simulation:
  n_z: 50
  n_r: 36
  years: 20
