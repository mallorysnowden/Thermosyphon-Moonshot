[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geowell_tea"
version = "0.1.0"
description = "Same-well TEA: deep gravity thermosiphon vs pumped coaxial borehole heat exchanger in reused oil & gas wells"
requires-python = ">=3.11"
# Versions pinned to the environment the model was built and tested in.
dependencies = [
  "numpy==2.5.3",
  "scipy==1.18.1",
  "pandas==3.0.5",
  "pyyaml==6.0.3",
  "matplotlib==3.11.2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
