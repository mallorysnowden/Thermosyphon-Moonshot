# Thermosyphon platform ("Project Cryo") TEA, v2 inputs
#
# One business selling thermosyphon ground-stabilization systems into several
# markets. Every market is sized as *addressable installed value per year at
# incumbent prices*, so one cost structure and one learning curve serve all of
# them. Unit costs are at NOAK; the FOAK-to-NOAK path comes from the learning
# rates. Fractions are written as decimals. "Assumption" = judgment, not sourced.

[meta]
project = "Thermosyphon platform (Project Cryo)"
boundary = "Supply, install, monitor and maintain thermosyphon systems. Excludes the customer's building, pad or road itself."
functional_units = "Foundations: $ per m2 protected per year. Roads: $ per km protected per year."

# --- Phasing and company costs --------------------------------------------

[company.rd_years]
base = 2
low = 1
high = 3
unit = "yr before first revenue"
source = "Assumption: Phase 1-2 (breakthrough + ground-freezing testbed) before commercial sales; long qualification for critical infrastructure"

[company.rd_opex]
base = 8_000_000
low = 5_000_000
high = 15_000_000
unit = "$/yr during R&D"
source = "Assumption: ~30-person team, instrumented testbed and prototypes"

[company.commercial_opex]
base = 6_000_000
low = 3_000_000
high = 12_000_000
unit = "$/yr once selling"
source = "Assumption"

[company.ga_share]
base = 0.03
low = 0.02
high = 0.05
unit = "fraction of revenue for G&A"
source = "Assumption: same 3% G&A share used in the prefab and SAF TEAs"

[company.capex_per_installed]
base = 0.15
low = 0.05
high = 0.30
unit = "$ capex per $ of added peak annual installed value"
source = "Assumption: fabrication shop, drill rigs and test equipment (added in the consistency audit)"

[company.service_tail_years]
base = 15
low = 5
high = 25
unit = "yr of service revenue on the installed base after the horizon"
source = "Assumption: about half of a 30-yr installation life remains on average"

[company.ramp]
base = [0.1, 0.3, 0.6, 1.0]
unit = "share of addressable volume captured, by commercial year (last value holds)"
source = "Assumption"

[company.market_growth]
base = 0.05
low = 0.0
high = 0.15
unit = "fraction/yr"
source = "Assumption: permafrost thaw and Arctic build-out grow demand over time"

[company.price_discount]
base = 0.15
low = 0.05
high = 0.30
unit = "fraction below incumbent price"
source = "Assumption"

[company.incumbent_cost_share]
base = 0.80
unit = "incumbent cost / incumbent price"
source = "Assumption"

# --- Cost structure: share of incumbent installed cost by component -----

[cost.share_hardware]
base = 0.30
unit = "fraction of incumbent installed cost"
source = "Assumption. Dandelion reports drilling and installation are 55-75% of a geothermal system's price, so hardware is a minority share."

[cost.share_install]
base = 0.40
unit = "fraction"
source = "Assumption (drilling and installation labor)"

[cost.share_logistics]
base = 0.15
unit = "fraction"
source = "Assumption (remote mobilization, freight, camps)"

[cost.share_engineering]
base = 0.15
unit = "fraction"
source = "Assumption (site characterization, thermal design, monitoring plan)"

# NOAK cost reduction vs incumbent, by component (the innovation targets)
[cost.noak_reduction_hardware]
base = 0.40
low = 0.20
high = 0.60
unit = "fraction"
source = "Target: factory standardization, automated welding, charging and leak test"

[cost.noak_reduction_install]
base = 0.15
low = 0.0
high = 0.30
unit = "fraction"
source = "Target. Dandelion's compact sonic drill raised installation cost in NYSERDA's evaluation, so kept modest."

[cost.noak_reduction_logistics]
base = 0.10
low = 0.0
high = 0.25
unit = "fraction"
source = "Target: modular kits, lighter equipment"

[cost.noak_reduction_engineering]
base = 0.30
low = 0.10
high = 0.50
unit = "fraction"
source = "Target: standardized design software and digital twins"

# Learning rates (cost decline per doubling of cumulative installed value)
[learning.rate_hardware]
base = 0.15
low = 0.10
high = 0.20
unit = "fraction per doubling"
source = "Assumption: typical for manufactured hardware"

[learning.rate_install]
base = 0.05
low = 0.0
high = 0.10
unit = "fraction per doubling"
source = "Drilling speed improves ~5-15% per doubling (Vernon 2023); UK heat-pump installed costs showed ~0% (Renaldi et al. 2020)"

[learning.rate_logistics]
base = 0.0
low = 0.0
high = 0.05
unit = "fraction per doubling"
source = "Assumption: remote logistics learn little"

[learning.rate_engineering]
base = 0.10
low = 0.05
high = 0.20
unit = "fraction per doubling"
source = "Assumption: design software improves with each project"

[learning.first_year_experience]
base = 5_000_000
low = 2_000_000
high = 10_000_000
unit = "$ cumulative installed value (incumbent prices) at the end of FOAK"
source = "Assumption: the first commercial projects"

[learning.noak_experience]
base = 300_000_000
low = 100_000_000
high = 1_000_000_000
unit = "$ cumulative installed value at which NOAK costs are reached"
source = "Assumption: definition of NOAK for this project"

# --- Performance and reliability -------------------------------------------

[performance.heat_removal_multiplier]
base = 1.0
low = 1.0
high = 1.5
unit = "x incumbent heat removed per unit"
source = "Assumption. Advanced or radiative-cooling condensers could raise it; no field data yet. Cuts hardware and install cost per m2 by 1/x."

[reliability.failure_rate_incumbent]
base = 0.01
low = 0.005
high = 0.05
unit = "fraction of units replaced per yr"
source = "Assumption. High case from arXiv 2108.10138: ~30% damaged in mounting and up to 50% more fail within a decade (a paper promoting a competing concept)."

[reliability.failure_rate_entrant]
base = 0.005
low = 0.002
high = 0.02
unit = "fraction/yr"
source = "Target: factory QA and serialized testing"

# --- Service revenue on the installed base ---------------------------------

[services.monitoring_fee]
base = 0.01
low = 0.005
high = 0.02
unit = "fraction of installed value per yr"
source = "Assumption. CSA S500:21 requires monitoring for thermosyphon foundations."

[services.monitoring_margin]
base = 0.70
unit = "fraction"
source = "Assumption"

[services.maintenance_fee]
base = 0.01
low = 0.005
high = 0.02
unit = "fraction of installed value per yr"
source = "Assumption: inspection and replacement contracts (an NWT inspection call-out was ~$5k CAD)"

[services.maintenance_margin]
base = 0.30
unit = "fraction"
source = "Assumption"

[services.attach_rate]
base = 0.60
low = 0.30
high = 0.90
unit = "fraction of installed base on a service contract"
source = "Assumption"

# --- Market A: data center and other permafrost foundations ---------------

[foundations.dc_mw_per_year]
base = 250
low = 50
high = 1000
unit = "MW/yr built on permafrost"
source = "Assumption. Stak Energy: up to 3 GW planned (50-year lease approved Nov 2026); Air Force: up to 12 data centers on Alaska bases."

[foundations.adoption]
base = 0.40
low = 0.20
high = 0.80
unit = "share of those sites that need thermosyphons"
source = "Assumption. Gravel pads, ventilated foundations and piles are alternatives; Canadian guidance says not to use thermosyphons on thaw-stable permafrost or with significant summer surface water."

[foundations.m2_per_mw]
base = 500
low = 300
high = 1000
unit = "m2 needing thermosyphons per MW"
source = "Stak's 640-acre pad for up to 3 GW is ~860 m2 of pad per MW; only heated buildings need active cooling."

[foundations.other_m2_per_year]
base = 10_000
low = 5_000
high = 50_000
unit = "m2/yr (hospitals, schools, industrial, mine buildings)"
source = "Assumption. About 80 flat-loop thermosyphon foundations were built in Canada by 2008 (review, ERDC/CRREL)."

[foundations.price_per_m2]
base = 300
low = 177
high = 600
unit = "$/m2, incumbent installed"
source = "Low: >=$177/m2 for small units (arXiv 2108.10138). Alaska builders: thermosyphons add $15k-40k per house."

[foundations.share]
base = 0.40
low = 0.20
high = 0.70
unit = "our share"
source = "Assumption"

# --- Market B: cold bank (seasonal cold storage) ---------------------------

[cold_bank.mw_per_year]
base = 0
unit = "MW/yr of data center IT"
source = "Set to 0 and left out of the sweeps: the cold-bank cooling model puts it at ~3x BAU cooling cost (results/cold_bank_cooling), so no customer would buy it at today's costs."

[cold_bank.value_per_mw]
base = 1_320_000
unit = "$ installed per MW of IT"
source = "Replace case in the cold-bank cooling model (50 thermosyphons at $25k plus loop)"

[cold_bank.share]
base = 0.30
unit = "our share"
source = "Assumption"

