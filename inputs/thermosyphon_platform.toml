source = "Arete Frontier Grants: up to $100k over two years; intervention-technology calls of similar size. High case = ARIA-scale. Cost-reimbursed, no profit."

# --- Foundation life-cycle comparison --------------------------------------

[foundations.life]
base = 30
unit = "yr"
source = "Assumption"

# --- Judgment scores for the rubric (1-5); quantitative evidence is in the report

[score.impact]
base = 3
unit = "1-5"
source = "Judgment: adaptation for a real but regional problem; glacier upside unproven"

[score.breakthrough]
base = 3
unit = "1-5"
source = "Judgment: deployment cost and condenser innovation; deep glacier units would be a 5"

[score.feasibility]
base = 4
unit = "1-5"
source = "Judgment: physics proven; cost reductions unproven"

[score.scalability]
base = 2
unit = "1-5"
source = "Judgment: limited to cold regions"

[score.demand]
base = 3
unit = "1-5"
source = "Judgment: paying customers exist but niches are fragmented"

[score.white_space]
base = 4
unit = "1-5"
source = "Judgment: small craft incumbents"

[score.validation]
base = 4
unit = "1-5"
source = "Judgment: testbed comparison is cheap and fast"
